name: Portal CI

on:
  pull_request:
    paths:
      - "portal/**"
      - "deploy/portal-compose.yml"
      - ".github/workflows/portal-ci.yml"
      - ".github/workflows/portal-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "deploy/portal-compose.yml"
      - ".github/workflows/portal-ci.yml"
      - ".github/workflows/portal-deploy.yml"

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: portal/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Check API syntax
        run: python -m compileall -q .

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend
      - api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t team03-portal-api:test portal/api

      - name: Build frontend image
        run: docker build -t team03-portal-frontend:test portal/frontend
