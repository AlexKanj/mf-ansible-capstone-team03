---
# Provision and seed DEV/TST source libraries for a z/OS user in racf_vars
# This playbook will populate a user's dataset with starter files found in the seed_files directory
#
# Usage:
#   ansible-playbook provision_new_dataset.yml
#   ansible-playbook provision_new_dataset.yml -e "userid=<xxx>"
#   ansible-playbook provision_new_dataset.yml -e "rebuild_datasets=true"
#
# Creates:
#   <userid>.DEV.COBOL
#   <userid>.DEV.JCL
#   <userid>.TST.COBOL
#   <userid>.TST.JCL
#
# Seeds:
#   <userid>.DEV.COBOL
#   <userid>.DEV.JCL

- name: Provision developer datasets on z/OS
  hosts: zos
  gather_facts: false

  collections:
    - ibm.ibm_zos_core

  environment: "{{ environment_vars }}"

  pre_tasks:
    - name: Load current managed RACF configuration
      ansible.builtin.include_tasks:
        file: tasks/load_racf_config.yml

  vars:
    mlq: DEV
    seed_base: "{{ playbook_dir }}/seed_files"
    # Safe by default. Set rebuild_datasets=true explicitly to delete and
    # recreate the managed data sets before provisioning them.
    rebuild_datasets: false
    libraries:
      - mlq: DEV
        libname: COBOL
        primary_allocation: 5
        secondary_allocation: 5

      - mlq: DEV
        libname: JCL
        primary_allocation: 2
        secondary_allocation: 4

      - mlq: TST
        libname: COBOL
        primary_allocation: 5
        secondary_allocation: 5

      - mlq: TST
        libname: JCL
        primary_allocation: 2
        secondary_allocation: 4
    managed_users: >-
      {{
        users
        | dict2items
        | map(attribute='value')
        | flatten
        | unique
        | sort
      }}

    target_users: >-
      {{
        [userid]
        if (
          userid is defined
          and (userid | string | trim | length) > 0
        )
        else managed_users
      }}

    metric_users: "{{ managed_users }}"

  tasks:
    - name: Provision datasets for each RACF user
      ansible.builtin.include_tasks: tasks/provision_user_datasets.yml
      loop: "{{ target_users }}"
      loop_control:
        loop_var: target_user
        label: "{{ target_user }}"
      vars:
        hlq: "{{ target_user }}"

    - name: Write provisioning metrics
      ansible.builtin.copy:
        dest: provision_metrics.prom
        mode: "0644"
        content: |
          # HELP zos_provision_users_total Number of managed users represented in the current provisioning snapshot
          # TYPE zos_provision_users_total gauge
          zos_provision_users_total {{ metric_users | length }}

          # HELP zos_provision_datasets_expected Number of datasets expected for each user
          # TYPE zos_provision_datasets_expected gauge
          {% for metric_user in metric_users %}
          zos_provision_datasets_expected{userid="{{ metric_user }}"} {{ libraries | length }}
          {% endfor %}

          # HELP zos_user_dataset_ready Whether a managed user dataset was provisioned and is expected ready
          # TYPE zos_user_dataset_ready gauge
          {% for metric_user in metric_users %}
          {% for library in libraries %}
          zos_user_dataset_ready{userid="{{ metric_user }}",dataset="{{ metric_user }}.{{ library.mlq }}.{{ library.libname }}",environment="{{ library.mlq }}",library_type="{{ library.libname }}"} 1
          {% endfor %}
          {% endfor %}

          # HELP zos_provision_rebuild_requested Whether rebuilding existing datasets was requested
          # TYPE zos_provision_rebuild_requested gauge
          zos_provision_rebuild_requested {{ 1 if rebuild_datasets | bool else 0 }}
      delegate_to: localhost
      run_once: true
