---
- name: Experiment with RACF group commands
  hosts: zos
  gather_facts: false

  collections:
    - ibm.ibm_zos_core

  environment: "{{ environment_vars }}"

  vars_files:
    - racf_vars.yml

  tasks:
    - name: Display RACF group definitions
      ansible.builtin.debug:
        var: racf_groups

    - name: Delete existing users
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "DELUSER {{ item.1 }}"
      loop: "{{ users | dict2items | subelements('value') }}" # loop over users using key as groups to be added and value as users to be added
      loop_control:
        label: "{{ item.1 }}"
      register: deluser_results
      failed_when: false

    - name: Show user deletion results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ deluser_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    # Reverse order because child groups must be deleted before parents.
    - name: Delete RACF groups if they already exist
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "DELGROUP {{ item.identity.name }}"
        max_rc: 8
      loop: "{{ racf_groups | reverse | list }}"
      loop_control:
        label: "{{ item.identity.name }}"
      register: initial_delete_results
      failed_when: false

    - name: Show initial deletion results
      ansible.builtin.debug:
        msg:
          group: "{{ item.item.identity.name }}"
          output: "{{ item.output }}"
      loop: "{{ initial_delete_results.results }}"
      loop_control:
        label: "{{ item.item.identity.name }}"

    # Create the base group. If the group already exists because deletion
    # was unable to remove it, continue and update it in the next task.
    - name: Create RACF base groups
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - >-
            ADDGROUP {{ item.identity.name }}
            OWNER({{ item.hierarchy.owner }})
            SUPGROUP({{ item.hierarchy.superior_group }})
        max_rc: 8
      loop: "{{ racf_groups }}"
      loop_control:
        label: "{{ item.identity.name }}"
      register: addgroup_results
      failed_when: false

    - name: Show ADDGROUP results
      ansible.builtin.debug:
        msg:
          group: "{{ item.item.identity.name }}"
          rc: "{{ item.output[0].rc | default('unknown') }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
      loop: "{{ addgroup_results.results }}"
      loop_control:
        label: "{{ item.item.identity.name }}"

    # Apply the OMVS GID separately. This works for both newly created
    # groups and groups that already existed.
    - name: Add or update RACF group OMVS segments
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - >-
            ALTGROUP {{ item.identity.name }}
            OMVS(GID({{ item.omvs.gid }}))
        max_rc: 8
      loop: "{{ racf_groups }}"
      loop_control:
        label: "{{ item.identity.name }} GID {{ item.omvs.gid }}"
      register: altgroup_omvs_results
      failed_when: false

    - name: Show ALTGROUP OMVS results
      ansible.builtin.debug:
        msg:
          group: "{{ item.item.identity.name }}"
          gid: "{{ item.item.omvs.gid }}"
          rc: "{{ item.output[0].rc | default('unknown') }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
      loop: "{{ altgroup_omvs_results.results }}"
      loop_control:
        label: "{{ item.item.identity.name }}"



    # Users are created with SYS1 as their default group so that
    # they can sign on through TSO.
    - name: Create users with SYS1 as the default group
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - >-
            ADDUSER {{ item.1 }}
            DFLTGRP(SYS1)
            NAME('{{ item.1 }}')
            OWNER(IBMUSER)
            PASSWORD({{ item.1 }})
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }}"
      register: adduser_results
      failed_when: false

    - name: Show ADDUSER results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ adduser_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    - name: Add TSO segment to users
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "ALTUSER {{ item.1 }} TSO(ACCTNUM(ACCT001) PROC(DB13PROC) SIZE(2096128) COMMAND(ISPF))"
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }}"
      register: altuser_tso_results
      failed_when: false

    - name: Show TSO segment results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ altuser_tso_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    - name: Add OMVS segment to users
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "ALTUSER {{ item.1 }} OMVS(AUTOUID HOME('/u/{{ item.1 | lower }}') PROGRAM('/bin/sh'))"
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }}"
      register: altuser_omvs_results
      failed_when: false

    - name: Show OMVS segment results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ altuser_omvs_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    # SYS1 is now the default group. Connect each user to its
    # application-specific group as a secondary group.
    - name: Connect users to their managed RACF groups
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "CONNECT {{ item.1 }} GROUP({{ item.0.key }})"
        max_rc: 8
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }} -> {{ item.0.key }}"
      register: connect_managed_group_results
      failed_when: false

    - name: Show managed RACF group connection results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          group: "{{ item.item.0.key }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ connect_managed_group_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    - name: Create USS home directories
      ansible.builtin.file:
        path: "/u/{{ item.1 | lower }}"
        state: directory
        owner: "{{ item.1 }}"
        group: "{{ item.0.key }}"
        mode: "0750"
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "/u/{{ item.1 | lower }}"
      register: home_directory_results
      failed_when: false

    - name: Show USS home directory results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          path: "/u/{{ item.item.1 | lower }}"
          failed: "{{ item.failed | default(false) }}"
          message: "{{ item.msg | default('') }}"
          changed: "{{ item.changed | default(false) }}"
      loop: "{{ home_directory_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    - name: Verify RACF groups
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTGRP {{ item.identity.name }} OMVS"
      loop: "{{ racf_groups }}"
      loop_control:
        label: "{{ item.identity.name }}"
      register: listgrp_results

    - name: Verify users with TSO and OMVS segments
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTUSER {{ item.1 }} TSO OMVS"
      loop: "{{ users | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.1 }}"
      register: listuser_results
      failed_when: false

    - name: Show LISTUSER results
      ansible.builtin.debug:
        msg:
          user: "{{ item.item.1 }}"
          output: "{{ item.output | default([]) }}"
          message: "{{ item.msg | default('') }}"
          failed: "{{ item.failed | default(false) }}"
      loop: "{{ listuser_results.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

    - name: Show LISTGRP results
      ansible.builtin.debug:
        msg:
          group: "{{ item.item.identity.name }}"
          output: "{{ item.output }}"
      loop: "{{ listgrp_results.results }}"
      loop_control:
        label: "{{ item.item.identity.name }}"

    - name: Build RACF group information
      ansible.builtin.set_fact:
        racf_group_report: >-
          {{
            racf_group_report | default({}) |
            combine({
              item.item.identity.name: {
                'created': (
                  (item.output[0].content | join(' '))
                  | regex_search('CREATED=([0-9.]+)', '\1')
                  | default('')
                ),
                'installation_data':
                  item.item.installation_data | default(''),
                'subgroups':
                  item.item.subgroups | default([]),
                'connected_users':
                  item.item.connected_users | default([]),
                'raw_output':
                  item.output[0].content
              }
            })
          }}
      loop: "{{ listgrp_results.results }}"
      loop_control:
        label: "{{ item.item.identity.name }}"

    - name: Display RACF group report
      ansible.builtin.debug:
        var: racf_group_report

    - name: Write RACF metrics
      ansible.builtin.copy:
        dest: racf_metrics.prom
        mode: "0644"
        content: |
          # HELP zos_racf_users_total Number of managed RACF users
          # TYPE zos_racf_users_total gauge
          zos_racf_users_total {{ users | dict2items | map(attribute='value') | flatten | unique | length }}

          # HELP zos_racf_groups_total Number of managed RACF groups
          # TYPE zos_racf_groups_total gauge
          zos_racf_groups_total {{ racf_groups | length }}

          # HELP zos_racf_user_present Whether a RACF user is present in its assigned group
          # TYPE zos_racf_user_present gauge
          {% for group_name, group_users in users.items() %}
          {% for userid in group_users %}
          zos_racf_user_present{userid="{{ userid }}",group="{{ group_name }}"} 1
          {% endfor %}
          {% endfor %}

          # HELP zos_racf_group_present Whether a managed RACF group is present
          # TYPE zos_racf_group_present gauge
          {% for group in racf_groups %}
          zos_racf_group_present{group="{{ group.identity.name }}",owner="{{ group.hierarchy.owner }}",superior_group="{{ group.hierarchy.superior_group }}",gid="{{ group.omvs.gid }}"} 1
          {% endfor %}

          # HELP zos_racf_dataset_access Desired dataset access assigned to a RACF user
          # TYPE zos_racf_dataset_access gauge
          {% for profile in dataset_profiles %}
          zos_racf_dataset_access{userid="{{ profile.userid }}",access="{{ profile.access }}"} 1
          {% endfor %}

          # HELP zos_racf_profile_uacc RACF dataset profile universal access setting
          # TYPE zos_racf_profile_uacc gauge
          zos_racf_profile_uacc{uacc="{{ profile_uacc }}"} 1
      delegate_to: localhost
      run_once: true

