---
all:
  children:
    zos:
      hosts:
        mainframe:
          ansible_host: 173.45.66.189
      vars:
        ansible_user: IBMUSER
        ansible_ssh_private_key_file: .ssh/id_rsa
        ansible_python_interpreter: /usr/lpp/IBM/cyp/v3r11/pyz/bin/python
        # z/OS SSH/module transfer settings
        ansible_pipelining: true
        ansible_ssh_transfer_method: scp
        ansible_scp_extra_args: -O
        # z/OS Python and ZOAU runtime environment
        environment_vars:
          _BPXK_AUTOCVT: ON
          _CEE_RUNOPTS: FILETAG(AUTOCVT,AUTOTAG) POSIX(ON)
          _TAG_REDIR_IN: txt
          _TAG_REDIR_OUT: txt
          _TAG_REDIR_ERR: txt
          LANG: C
          ZOAU_HOME: /usr/lpp/IBM/zoautil
          PATH: >-
            /usr/lpp/IBM/cyp/v3r11/pyz/bin:
            /usr/lpp/IBM/zoautil/bin:
            /bin:
            /usr/bin
          LIBPATH: >-
            /usr/lpp/IBM/cyp/v3r11/pyz/lib:
            /usr/lpp/IBM/zoautil/lib:
            /lib:
            /usr/lib:
            .
          PYTHONPATH: >-
            /usr/lpp/IBM/cyp/v3r11/pyz/lib/python3.11:
            /usr/lpp/IBM/zoautil/lib
