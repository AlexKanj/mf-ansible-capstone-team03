###############################################################################
# This sample playbook demonstrates basic usage of the cmci_get module
# included in the ibm.ibm_zos_cics collection
#
# Usage:
#  ansible-playbook report.yml
#
# Notes:
#  This sample playbook demonstrates how to use the cmci_get module from the
#  ibm.ibm_zos_cics collection to retrieve operational data from running CICS
#  regions. This example, retrieves information corresponding to the CICSRGN
#  resource table, but can be adapted to retrieve information about any of the
#  resource tables supported by CPSM. The retrieved information is written to a
#  csv file, suitable for opening as a spreadsheet.  This sample additionally
#  shows how to automate installation of pre-requisites for the CMCI modules.
#
# Requirements:
#   IBM z/OS CICS collection 1.0.0 or later
###############################################################################
---
- name: CICS CMCI Report

  hosts: "localhost"
  gather_facts: false

  # CMCI endpoint settings are loaded from the mainframe inventory host.

  vars:
    cmci_host: >-
      {{
        lookup('ansible.builtin.env', 'CMCI_HOST')
        | default('173.45.66.189', true)
      }}

    cmci_port: >-
      {{
        lookup('ansible.builtin.env', 'CMCI_PORT')
        | default('1490', true)
      }}

    scheme: >-
      {{
        lookup('ansible.builtin.env', 'CMCI_SCHEME')
        | default('http', true)
      }}

    cmci_context: >-
      {{
        lookup('ansible.builtin.env', 'CMCI_CONTEXT')
        | default('', true)
      }}
    cmci_user: "{{ lookup('ansible.builtin.env', 'CMCI_USER') }}"
    cmci_password: "{{ lookup('ansible.builtin.env', 'CMCI_PASSWORD') }}"

    pushgateway_url: >-
      {{
        lookup('ansible.builtin.env', 'PUSHGATEWAY_URL')
        | default('http://50.18.75.128:9091', true)
      }}

    prometheus_metrics_file: "{{ playbook_dir }}/cics_metrics.prom"

    attributes:
      - eyu_cicsname
      - release
      - jobid
      - totltasks
    cmci_host: "{{ hostvars['mainframe']['cmci_host'] }}"
    cmci_port: "{{ hostvars['mainframe']['cmci_port'] }}"
    scheme: "{{ hostvars['mainframe']['scheme'] }}"
    context: "{{ hostvars['mainframe']['context'] | default('') }}"

  tasks:
    ############################################################################
    # Install module dependencies
    ############################################################################
    - name: Make sure CMCI module dependencies are installed
      ansible.builtin.pip:
        name:
          - requests
          - xmltodict
          - typing;python_version<"3.5"

    ############################################################################
    # Get information about CICS regions from the supplied context, using CMCI
    ############################################################################
    - name: Get information about CICS regions
      ibm.ibm_zos_cics.cmci_get:
        context: "{{ cmci_context }}"
        cmci_host: "{{ cmci_host }}"
        cmci_port: "{{ cmci_port | int }}"
        cmci_user: "{{ cmci_user | default(omit, true) }}"
        cmci_password: "{{ cmci_password | default(omit, true) }}"
        scheme: "{{ scheme }}"
        type: CICSRegion
        fail_on_nodata: false
      register: result
      changed_when: false

    ############################################################################
    # Print the response from CMCI to the log - useful to see attribute names!
    ############################################################################
    #    - debug:
    #        msg: '{{ result }}'

    ############################################################################
    # Write the report csv file using a template
    ############################################################################
    - name: Create CSV report from template
      ansible.builtin.template:
        src: csv.j2
        dest: "{{ playbook_dir }}/report.csv"
        mode: "0644"

